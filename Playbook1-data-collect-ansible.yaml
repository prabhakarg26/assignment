---
# ==============================================================================
# Playbook: EC2 Disk Usage
# Purpose: Executes a python script for extracting disk usage information from every EC2 instance from all AWS accounts
# ==============================================================================

- name: Execute a Python script for extracting disk usage
  hosts: all
  become: false  # Set to true if the script needs root/sudo privileges

  tasks:
    - name: Run local Python script
      ansible.builtin.script: /home/ansible/playbooks/ec2-disk-usage.py
      args:
        executable: python3
      register: script_result

    - name: Display script output
      ansible.builtin.debug:
        var: script_result.stdout_lines
