---
- name: Transfer and execute a Python script
  hosts: all
  become: false  # Set to true if the script needs root/sudo privileges

  tasks:
    - name: Run local Python script on remote hosts
      ansible.builtin.script: /path/to/local/my_script.py
      args:
        executable: python3
      register: script_result

    - name: Display script output
      ansible.builtin.debug:
        var: script_result.stdout_lines
